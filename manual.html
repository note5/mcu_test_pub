<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Manual Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container { max-width: 520px; width: 100%; }

        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.8em; margin-bottom: 6px; }

        .connection-bar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        .dot.connected { background: #44ff44; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 18px;
        }
        .card h3 { font-size: 1.2em; margin-bottom: 14px; }

        .sensor-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .sensor-row.center {
            justify-content: center;
        }
        .sensor-box {
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            flex: 0 1 45%;
        }
        .sensor-row.center .sensor-box {
            flex: 0 1 45%;
        }
        .sensor-box .label { font-size: 0.78em; opacity: 0.7; margin-bottom: 4px; }
        .sensor-box .value { font-size: 1.4em; font-weight: bold; }

        .ref-box {
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 14px;
        }
        .ref-box .label { font-size: 0.78em; opacity: 0.7; margin-bottom: 4px; }
        .ref-box .value { font-size: 1.4em; font-weight: bold; }

        .limit-row {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .limit-box {
            flex: 1;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .limit-dot {
            width: 13px; height: 13px;
            border-radius: 50%;
            background: #555;
            display: inline-block;
        }
        .limit-dot.active { background: #ff4444; }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        button {
            flex: 1;
            background: rgba(255,255,255,0.18);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button.active {
            background: rgba(68,255,68,0.3);
            border-color: #44ff44;
        }
        .stop-btn {
            width: 100%;
            background: rgba(255,68,68,0.5);
            border-color: #ff4444;
            font-size: 18px;
            padding: 18px;
            margin-bottom: 0;
        }
        .stop-btn:hover { background: rgba(255,68,68,0.8); }

        .state-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 1em;
        }
        .state-badge {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 4px 12px;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .serial-log {
            background: rgba(0,0,0,0.35);
            border-radius: 10px;
            padding: 10px 12px;
            max-height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Platform Manual Control</h1>
    </header>

    <!-- Connection status (click to connect) -->
    <div class="connection-bar" id="connBar" onclick="toggleConnection()">
        <div class="dot" id="connDot"></div>
        <span id="connText">Click to connect via Web Serial</span>
    </div>

    <!-- Ultrasonic Sensors (5-sensor layout) -->
    <div class="card">
        <h3>Ultrasonic Sensors (cm)</h3>
        <!-- corners + center arranged spatially -->
        <div class="sensor-row">
            <div class="sensor-box">
                <div class="label">Corner 1</div>
                <div class="value" id="hc1">--</div>
            </div>
            <div class="sensor-box">
                <div class="label">Corner 2</div>
                <div class="value" id="hc2">--</div>
            </div>
        </div>
        <div class="sensor-row center">
            <div class="sensor-box">
                <div class="label">Center</div>
                <div class="value" id="hc0">--</div>
            </div>
        </div>
        <div class="sensor-row">
            <div class="sensor-box">
                <div class="label">Corner 3</div>
                <div class="value" id="hc3">--</div>
            </div>
            <div class="sensor-box">
                <div class="label">Corner 4</div>
                <div class="value" id="hc4">--</div>
            </div>
        </div>

        <div class="ref-box">
            <div class="label">Platform Ref (cm)</div>
            <div class="value" id="platformRef">--</div>
        </div>
    </div>

    <!-- Platform Control -->
    <div class="card">
        <h3>Platform Control</h3>

        <!-- Limit switches -->
        <div class="limit-row">
            <div class="limit-box">
                <span class="limit-dot" id="topLimitDot"></span>
                <span>Top Limit</span>
            </div>
            <div class="limit-box">
                <span class="limit-dot" id="bottomLimitDot"></span>
                <span>Bottom Limit</span>
            </div>
        </div>

        <!-- State -->
        <div class="state-row">
            State: <span class="state-badge" id="platformState">--</span>
        </div>

        <!-- Up / Down -->
        <div class="btn-row">
            <button id="btnUp" onclick="platformCmd('platform-up')">&#9650; UP</button>
            <button id="btnDown" onclick="platformCmd('platform-down')">&#9660; DOWN</button>
        </div>

        <!-- Stop -->
        <button class="stop-btn" onclick="platformCmd('platform-stop')">&#9632; STOP</button>
    </div>

    <!-- Serial Log -->
    <div class="card">
        <h3>Log</h3>
        <div class="serial-log" id="log"></div>
    </div>
</div>

<script>
    let port = null;
    let reader = null;
    let writer = null;
    let readBuffer = '';
    let connected = false;
    let pollTimer = null;

    // ── Web Serial connect / disconnect ─────────────────────────────────
    async function toggleConnection() {
        if (connected) {
            await disconnect();
        } else {
            await connect();
        }
    }

    async function connect() {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 9600, bufferSize: 4096 });

            const decoder = new TextDecoderStream();
            port.readable.pipeTo(decoder.writable);
            reader = decoder.readable.getReader();

            const encoder = new TextEncoderStream();
            encoder.readable.pipeTo(port.writable);
            writer = encoder.writable.getWriter();

            connected = true;
            updateConnUI();
            appendLog('Connected');
            readLoop();
            startPolling();
        } catch (e) {
            appendLog('Connection failed: ' + e.message);
        }
    }

    async function disconnect() {
        connected = false;
        stopPolling();
        try { if (reader) reader.cancel(); } catch (e) {}
        try { if (writer) writer.close(); } catch (e) {}
        try { if (port) await port.close(); } catch (e) {}
        reader = null;
        writer = null;
        port = null;
        updateConnUI();
        appendLog('Disconnected');
    }

    function updateConnUI() {
        document.getElementById('connDot').classList.toggle('connected', connected);
        document.getElementById('connText').textContent =
            connected ? 'MCU Connected (click to disconnect)' : 'Click to connect via Web Serial';
    }

    // ── Read loop ───────────────────────────────────────────────────────
    async function readLoop() {
        while (connected && reader) {
            try {
                const { value, done } = await reader.read();
                if (done) break;
                readBuffer += value;
                let idx;
                while ((idx = readBuffer.indexOf('\n')) !== -1) {
                    const line = readBuffer.substring(0, idx).trim();
                    readBuffer = readBuffer.substring(idx + 1);
                    if (line) processLine(line);
                }
            } catch (e) {
                if (connected) {
                    appendLog('Read error: ' + e.message);
                    await disconnect();
                }
                break;
            }
        }
    }

    // ── Send command ────────────────────────────────────────────────────
    async function sendCmd(cmd) {
        if (!connected || !writer) {
            appendLog('Not connected');
            return;
        }
        try {
            await writer.write(cmd + '\n');
        } catch (e) {
            appendLog('Write error: ' + e.message);
            await disconnect();
        }
    }

    // ── Parse MCU lines ─────────────────────────────────────────────────
    function processLine(line) {
        appendLog(line);

        // platform-status:idle,ref:10.00,top:0,bottom:1
        if (line.startsWith('platform-status:')) {
            const body = line.slice('platform-status:'.length);
            const parts = body.split(',');
            document.getElementById('platformState').textContent = parts[0] || '--';
            for (const p of parts) {
                if (p.startsWith('ref:'))
                    document.getElementById('platformRef').textContent =
                        parseFloat(p.slice(4)).toFixed(1);
                if (p.startsWith('top:'))
                    document.getElementById('topLimitDot')
                        .classList.toggle('active', p.slice(4) === '1');
                if (p.startsWith('bottom:'))
                    document.getElementById('bottomLimitDot')
                        .classList.toggle('active', p.slice(7) === '1');
            }
        }
        // hc-level:12.3,14.5,11.2,13.8,12.0
        else if (line.startsWith('hc-level:')) {
            const vals = line.slice('hc-level:'.length).split(',');
            for (let i = 0; i < 5; i++) {
                const el = document.getElementById('hc' + i);
                if (!el) continue;
                const v = parseFloat(vals[i]);
                el.textContent = isNaN(v) || v < 0 ? '--' : v.toFixed(1);
            }
        }
    }

    // ── Platform buttons ────────────────────────────────────────────────
    function platformCmd(cmd) {
        document.getElementById('btnUp').classList.remove('active');
        document.getElementById('btnDown').classList.remove('active');
        if (cmd === 'platform-up')   document.getElementById('btnUp').classList.add('active');
        if (cmd === 'platform-down') document.getElementById('btnDown').classList.add('active');
        if (cmd === 'platform-stop') {
            document.getElementById('btnUp').classList.remove('active');
            document.getElementById('btnDown').classList.remove('active');
        }
        sendCmd(cmd);
    }

    // ── Polling (disabled — MCU auto-reports every 2s) ────────────────
    function startPolling() {}
    function stopPolling() {}

    // ── Log ─────────────────────────────────────────────────────────────
    function appendLog(text) {
        const el = document.getElementById('log');
        el.textContent += text + '\n';
        el.scrollTop = el.scrollHeight;
        const lines = el.textContent.split('\n');
        if (lines.length > 60) el.textContent = lines.slice(-60).join('\n');
    }
</script>
</body>
</html>
