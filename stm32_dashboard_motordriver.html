<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCU Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .connection-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .status-text {
            font-size: 1.1em;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .direction-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .direction-buttons button {
            flex: 1;
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
        }

        .direction-buttons button.active {
            background: rgba(68, 255, 68, 0.3);
            border-color: #44ff44;
        }

        .stop-btn {
            width: 100%;
            background: #ff4444;
            border-color: #ff0000;
            font-weight: bold;
            font-size: 18px;
            padding: 16px;
        }

        .stop-btn:hover {
            background: #ff0000;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .sensor-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .sensor-box .label {
            font-size: 0.85em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .sensor-box .value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .limit-indicators {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .limit-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .limit-box .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #555;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        .limit-box .dot.active {
            background: #ff4444;
        }

        .serial-log {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MCU Dashboard</h1>
        </header>

        <div class="connection-bar">
            <div class="connection-status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <button id="connectBtn" onclick="connectSerial()">Connect</button>
        </div>

        <!-- Sensor Readings -->
        <div class="card">
            <h3>Sensors</h3>
            <div class="sensor-grid">
                <div class="sensor-box">
                    <div class="label">I2C Level (cm)</div>
                    <div class="value" id="i2cLevel">--</div>
                </div>
                <div class="sensor-box">
                    <div class="label">HC-SR05 (cm)</div>
                    <div class="value" id="hcLevel">--</div>
                </div>
            </div>
            <div class="direction-buttons">
                <button onclick="sendCommand('level')">Read I2C</button>
                <button onclick="sendCommand('hc-level')">Read HC-SR05</button>
                <button onclick="sendCommand('doors')">Door Status</button>
            </div>
        </div>

        <!-- Motor Control -->
        <div class="card">
            <h3>Motor Control</h3>
            <div class="status-text" id="motorStatus">Stopped</div>
            <div class="direction-buttons">
                <button id="btnFwd" onclick="sendMotor('forward')">Forward</button>
                <button id="btnBack" onclick="sendMotor('back')">Back</button>
            </div>
            <button class="stop-btn" onclick="sendMotor('stop')">STOP MOTOR</button>
        </div>

        <!-- Platform Control -->
        <div class="card">
            <h3>Platform Control</h3>
            <div class="limit-indicators">
                <div class="limit-box">
                    <span class="dot" id="topLimitDot"></span>
                    <span>Top Limit</span>
                </div>
                <div class="limit-box">
                    <span class="dot" id="bottomLimitDot"></span>
                    <span>Bottom Limit</span>
                </div>
            </div>
            <div class="sensor-grid">
                <div class="sensor-box">
                    <div class="label">State</div>
                    <div class="value" id="platformState" style="font-size:1.1em">--</div>
                </div>
                <div class="sensor-box">
                    <div class="label">Reference (cm)</div>
                    <div class="value" id="platformRef">--</div>
                </div>
            </div>
            <div class="direction-buttons">
                <button id="btnUp" onclick="sendPlatform('platform-up')">UP</button>
                <button id="btnDown" onclick="sendPlatform('platform-down')">DOWN</button>
            </div>
            <button class="stop-btn" onclick="sendPlatform('platform-stop')">STOP PLATFORM</button>
            <div style="margin-top:12px">
                <button onclick="sendCommand('platform-status')" style="width:100%">Refresh Status</button>
            </div>
        </div>

        <!-- Serial Log -->
        <div class="card">
            <h3>Serial Log</h3>
            <div class="serial-log" id="serialLog"></div>
        </div>
    </div>

    <script>
        let port = null;
        let reader = null;
        let writer = null;
        let pollInterval = null;

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600, bufferSize: 4096 });

                const encoder = new TextEncoderStream();
                encoder.readable.pipeTo(port.writable);
                writer = encoder.writable.getWriter();

                document.getElementById('statusIndicator').classList.add('connected');
                document.getElementById('statusText').textContent = 'Connected';
                document.getElementById('connectBtn').textContent = 'Disconnect';
                document.getElementById('connectBtn').onclick = disconnectSerial;

                readSerialData();

                // auto-poll sensors and platform status every 3s, sequential
                pollInterval = setInterval(async () => {
                    await sendCommand('level');
                    await sendCommand('hc-level');
                    await sendCommand('platform-status');
                }, 3000);

            } catch (error) {
                console.error('Connection error:', error);
                alert('Failed to connect to serial port');
            }
        }

        async function disconnectSerial() {
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
            if (reader) { try { await reader.cancel(); } catch(e) {} reader = null; }
            if (writer) { try { await writer.close(); } catch(e) {} writer = null; }
            if (port) { try { await port.close(); } catch(e) {} port = null; }

            document.getElementById('statusIndicator').classList.remove('connected');
            document.getElementById('statusText').textContent = 'Disconnected';
            document.getElementById('connectBtn').textContent = 'Connect';
            document.getElementById('connectBtn').onclick = connectSerial;
        }

        async function readSerialData() {
            let buffer = '';
            while (port && port.readable) {
                try {
                    reader = port.readable.getReader();
                    const decoder = new TextDecoder();
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value);
                        let lines = buffer.split('\n');
                        buffer = lines.pop();
                        for (let line of lines) {
                            processResponse(line.trim());
                        }
                    }
                } catch (error) {
                    console.error('Read error, retrying:', error);
                    appendLog('Serial read error, reconnecting...');
                } finally {
                    try { reader.releaseLock(); } catch (e) {}
                }
            }
        }

        function processResponse(line) {
            if (!line) return;
            appendLog(line);

            if (line.startsWith('level:')) {
                const val = parseFloat(line.split(':')[1]);
                document.getElementById('i2cLevel').textContent = val > 0 ? val.toFixed(1) : '--';
            }
            else if (line.startsWith('hc-level:')) {
                const val = parseFloat(line.split(':')[1]);
                document.getElementById('hcLevel').textContent = val > 0 ? val.toFixed(1) : '--';
            }
            else if (line.startsWith('platform-status:')) {
                // format: platform-status:idle,ref:15.00,top:0,bottom:0
                const parts = line.substring('platform-status:'.length).split(',');
                const state = parts[0];
                let ref = '--', top = '0', bottom = '0';
                for (const p of parts) {
                    if (p.startsWith('ref:')) ref = parseFloat(p.split(':')[1]).toFixed(1);
                    if (p.startsWith('top:')) top = p.split(':')[1];
                    if (p.startsWith('bottom:')) bottom = p.split(':')[1];
                }
                document.getElementById('platformState').textContent = state;
                document.getElementById('platformRef').textContent = ref;
                document.getElementById('topLimitDot').classList.toggle('active', top === '1');
                document.getElementById('bottomLimitDot').classList.toggle('active', bottom === '1');
            }
            else if (line.startsWith('door-status:')) {
                appendLog('Doors: ' + line.substring('door-status:'.length));
            }
        }

        function appendLog(text) {
            const log = document.getElementById('serialLog');
            log.textContent += text + '\n';
            log.scrollTop = log.scrollHeight;
            // keep last 50 lines
            const lines = log.textContent.split('\n');
            if (lines.length > 50) {
                log.textContent = lines.slice(-50).join('\n');
            }
        }

        async function sendCommand(cmd) {
            if (writer) {
                try { await writer.write(cmd + '\n'); }
                catch (error) { console.error('Write error:', error); }
            }
        }

        function sendMotor(dir) {
            document.getElementById('btnFwd').classList.remove('active');
            document.getElementById('btnBack').classList.remove('active');
            if (dir === 'forward') {
                document.getElementById('btnFwd').classList.add('active');
                document.getElementById('motorStatus').textContent = 'Forward';
            } else if (dir === 'back') {
                document.getElementById('btnBack').classList.add('active');
                document.getElementById('motorStatus').textContent = 'Backward';
            } else {
                document.getElementById('motorStatus').textContent = 'Stopped';
            }
            sendCommand(dir);
        }

        function sendPlatform(cmd) {
            document.getElementById('btnUp').classList.remove('active');
            document.getElementById('btnDown').classList.remove('active');
            if (cmd === 'platform-up') {
                document.getElementById('btnUp').classList.add('active');
            } else if (cmd === 'platform-down') {
                document.getElementById('btnDown').classList.add('active');
            }
            sendCommand(cmd);
            // refresh status after action
            setTimeout(() => sendCommand('platform-status'), 500);
        }
    </script>
</body>
</html>
